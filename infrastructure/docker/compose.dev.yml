# CipherMesh local development services (CM-T011).
#
# DEVELOPMENT ONLY. This is not the production design: production uses managed PostgreSQL
# (PaaS) and provider-managed object storage (docs/cloud/service-models.md).
# - Ports bind to 127.0.0.1 only and are never reachable from the network.
# - Credentials come from the git-ignored .env file; there are no defaults, and
#   development credentials must never be reused anywhere else.
# - Images are pinned by digest (T-27). The app containers arrive in Phase 17.
#
# Start: pnpm services:up    Stop: pnpm services:down
name: ciphermesh-dev

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # S3-compatible emulator. SeaweedFS (Apache-2.0, actively maintained) was chosen because
  # the MinIO community edition stopped shipping images in 2025 and was archived in 2026
  # (decision OD-03, docs/architecture/engineering-baseline.md). Only the S3 port is published.
  object-storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - 127.0.0.1:${S3_PORT:-8333}:8333
    volumes:
      - object-storage-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

volumes:
  postgres-data:
  object-storage-data:
