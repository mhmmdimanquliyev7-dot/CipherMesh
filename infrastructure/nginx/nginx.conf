# CipherMesh edge (CM-T066, deployment-architecture.md section 4). Runs as the unprivileged nginx
# user (uid 101) on a read-only root filesystem: pid and temporary files live in the /tmp tmpfs,
# and the per-host server blocks are rendered at start from /etc/nginx/templates into /tmp/conf.d.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 20s;
  # Slow-client limits (T-26).
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;
  client_max_body_size 128k;
  large_client_header_buffers 4 16k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Access log without query strings (presigned URLs carry their signature in the query; INV-10)
  # and without bodies. $uri is the path only.
  log_format cm_json escape=json '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
    '"remote":"$remote_addr","ua":"$http_user_agent"}';
  access_log /dev/stdout cm_json;

  # Rate limits per client address (deployment-architecture.md section 4). The API applies its own
  # per-account limits behind these.
  limit_req_zone $binary_remote_addr zone=cm_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=cm_lookup:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=cm_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=cm_files:10m rate=10r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=cm_conn:10m;

  include /tmp/conf.d/*.conf;
}
