# Reverse proxy to the API container (TB-04). Spoofable forwarding headers from the client are
# replaced, not appended: the API trusts exactly one hop (TRUST_PROXY_HOPS=1).
proxy_pass http://api:4100;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 35s;
proxy_send_timeout 35s;
proxy_buffering on;
# The API sets its own headers (no-store, nosniff, frame denial); HSTS is added here.
include /tmp/conf.d/hsts.inc;
