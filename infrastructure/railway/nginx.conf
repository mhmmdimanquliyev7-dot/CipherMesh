# CipherMesh edge for the Railway trial demonstration (docs/deployment/railway-demo.md). Plain HTTP
# on $PORT behind Railway's TLS edge; the server block is rendered at start from /etc/nginx/templates.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 20s;
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;
  client_max_body_size 128k;
  large_client_header_buffers 4 16k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # No query strings in the access log (INV-10), no bodies.
  log_format cm_json escape=json '{"time":"$time_iso8601","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"remote":"$remote_addr"}';
  access_log /dev/stdout cm_json;

  limit_req_zone $binary_remote_addr zone=cm_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=cm_lookup:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=cm_api:10m rate=50r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=cm_conn:10m;

  include /tmp/conf.d/*.conf;
}
