# Railway demonstration. There is no public TCP proxy: only services of this project reach the
# database, over the private network, and only with TLS. The superuser has a password only while
# the one-off bootstrap runs (it is set to NULL afterwards, as cm-db-init does).
local     all         postgres                                          peer
hostssl   postgres    postgres                          all             scram-sha-256
hostssl   ciphermesh  postgres,cm_api,cm_worker,cm_verifier,cm_migrator all scram-sha-256
hostnossl all         all                               all             reject
