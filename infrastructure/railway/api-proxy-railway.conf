# Reverse proxy to the API over Railway's private network. Forwarding headers from the client are
# replaced, not appended: the API trusts exactly one hop (TRUST_PROXY_HOPS=1). $remote_addr is the
# visitor's address (set_real_ip_from in the server block); Railway's edge speaks HTTPS to browsers.
proxy_pass $cm_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 35s;
proxy_send_timeout 35s;
proxy_buffering on;
include /tmp/conf.d/hsts.inc;
