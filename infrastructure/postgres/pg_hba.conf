# Client authentication for the cloud demonstration database (ADR-014). First match wins; a
# connection that matches no line is refused.
#
# TYPE    DATABASE    USER                              ADDRESS         METHOD
# Superuser: only by peer authentication on the container socket (docker exec -u postgres), that is
# by root on the VM. It has no password, so it cannot log in over any network (residual risk L-71).
local     all         postgres                                          peer
# Operator tasks (cm-db-init, cm-migrate): the ops container shares this container's network
# namespace, so 127.0.0.1 here is not reachable from any other container or from the host.
host      all         all                               127.0.0.1/32    scram-sha-256
# Runtime roles from the internal data network: TLS required, password verified with SCRAM.
hostssl   ciphermesh  cm_api,cm_worker,cm_verifier      samenet         scram-sha-256
# Everything else, explicitly: no connection without TLS from the network.
hostnossl all         all                               all             reject
