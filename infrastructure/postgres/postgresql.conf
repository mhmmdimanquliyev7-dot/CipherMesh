# PostgreSQL 17 for the cloud demonstration VM (ADR-014, docs/security/database-security.md).
# Sized for 2 OCPUs and 12 GB shared with the rest of the stack (container limit 1.5 GB).
listen_addresses = '*'          # the container's interfaces only: the internal "data" network and loopback
port = 5432
hba_file = '/etc/ciphermesh/pg_hba.conf'
unix_socket_directories = '/var/run/postgresql'

# Connections: cm_api 40 (pool 10 per process), cm_worker 10, cm_migrator 5, cm_verifier 5
# (role connection limits from scripts/db/lib.mjs), plus superuser slots.
max_connections = 70
superuser_reserved_connections = 3

# TLS (CP-21): runtime roles must connect with TLS and verify the server certificate
# (sslmode=verify-full against the deployment's private CA, cm-pki). TLS 1.3 only on this hop.
ssl = on
ssl_cert_file = '/etc/ciphermesh/tls/server.crt'
ssl_key_file = '/etc/ciphermesh/tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'

# Memory
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
min_wal_size = 80MB

# Logging to stderr (Docker log with rotation). Statements and their parameters are never logged:
# the application uses parameterized queries, and role passwords are set with logging off.
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = off
log_statement = 'none'
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# Bounded runaway work (T-26); the runtime roles have tighter per-role settings.
idle_in_transaction_session_timeout = '5min'
