# Weekly dependency and action updates (CM-T076). Updates still pass CI and SECURITY REVIEW.
# The workspace's minimumReleaseAge (pnpm-workspace.yaml) also applies when they are installed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /infrastructure/docker
    schedule:
      interval: weekly
