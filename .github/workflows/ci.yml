# CipherMesh CI (CM-T012). Every job must pass before a pull request can merge into main.
# Third-party actions are pinned to full commit SHAs (T-27); the comment shows the tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build, E2E
    runs-on: ubuntu-24.04
    # Phase 14 + Prompt 16.5 added 42 browser tests (186 per run in three engines); the E2E step
    # alone takes about 22 minutes on the hosted runner, so 30 minutes no longer covered the job.
    timeout-minutes: 45
    # Throwaway PostgreSQL for the database suite and the smoke test (CM-T013, CM-T014). Same
    # pinned image as local development. The administrator password exists only for the life of
    # this runner; it is not a secret of any real system. Role passwords are random per run.
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: ciphermesh_ci
          POSTGRES_USER: ciphermesh_ci
          POSTGRES_PASSWORD: ci-only-ephemeral-admin
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U ciphermesh_ci -d ciphermesh_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: ciphermesh_ci
      POSTGRES_USER: ciphermesh_ci
      POSTGRES_PASSWORD: ci-only-ephemeral-admin
      POSTGRES_PORT: '55432'
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Prisma schema validation and forbidden-field check
        run: |
          pnpm db:validate
          pnpm db:check-schema
      - name: Database role passwords for this run (random, masked)
        run: |
          for pair in MIGRATION_DATABASE_URL:cm_migrator DATABASE_URL:cm_api WORKER_DATABASE_URL:cm_worker VERIFIER_DATABASE_URL:cm_verifier; do
            password="$(openssl rand -hex 24)"
            echo "::add-mask::${password}"
            echo "${pair%%:*}=postgresql://${pair##*:}:${password}@127.0.0.1:55432/ciphermesh" >> "$GITHUB_ENV"
          done
      # The seed loads the full API configuration, which requires the authentication keys from
      # Phase 3 (CP-11, CP-12). Random per run, masked, never stored: there is no .env in CI.
      - name: Authentication keys for this run (random, masked)
        run: |
          for name in TOTP_ENCRYPTION_KEY IDENTIFIER_HMAC_KEY; do
            key="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
            echo "::add-mask::${key}"
            echo "${name}=${key}" >> "$GITHUB_ENV"
          done
          echo "TOTP_ENCRYPTION_KEY_ID=ci-ephemeral" >> "$GITHUB_ENV"
      # Object storage for the files suites and E2E (Phase 7, CM-T037): the same pinned SeaweedFS
      # image as local development, with an administrator identity (bucket creation only) and the
      # scoped runtime identity the API uses (read and write objects in cm-files, nothing else).
      # Credentials are random for this run and masked; CORS answers only the E2E origin.
      - name: Object storage for this run (SeaweedFS, scoped runtime identity)
        run: |
          admin_key="cmadmin$(openssl rand -hex 8)"
          admin_secret="$(openssl rand -hex 24)"
          runtime_key="cmrt$(openssl rand -hex 8)"
          runtime_secret="$(openssl rand -hex 24)"
          echo "::add-mask::${admin_secret}"
          echo "::add-mask::${runtime_secret}"
          mkdir -p "${RUNNER_TEMP}/seaweedfs"
          printf '{"identities":[{"name":"cm-admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]},{"name":"cm-runtime","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:cm-files","Write:cm-files"]}]}' \
            "${admin_key}" "${admin_secret}" "${runtime_key}" "${runtime_secret}" > "${RUNNER_TEMP}/seaweedfs/identities.json"
          docker run --detach --name cm-object-storage --publish 127.0.0.1:8333:8333 \
            --volume "${RUNNER_TEMP}/seaweedfs:/etc/seaweedfs:ro" --security-opt no-new-privileges:true \
            chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/identities.json \
            -s3.allowedOrigins=https://127.0.0.1:4173
          {
            echo "S3_ACCESS_KEY_ID=${admin_key}"
            echo "S3_SECRET_ACCESS_KEY=${admin_secret}"
            echo "STORAGE_ENDPOINT=http://127.0.0.1:8333"
            echo "STORAGE_BUCKET=cm-files"
            echo "STORAGE_ACCESS_KEY_ID=${runtime_key}"
            echo "STORAGE_SECRET_ACCESS_KEY=${runtime_secret}"
          } >> "${GITHUB_ENV}"
      - name: Object storage bucket and runtime-credential scope check
        run: |
          for attempt in $(seq 1 30); do
            if node scripts/storage/bootstrap.mjs > "${RUNNER_TEMP}/storage-bootstrap.log" 2>&1; then
              cat "${RUNNER_TEMP}/storage-bootstrap.log"
              exit 0
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/storage-bootstrap.log"
          exit 1
      - name: Database roles, migrations from zero, drift check, synthetic seed
        run: |
          pnpm db:bootstrap
          pnpm db:migrate
          pnpm db:drift
          NODE_ENV=development APP_ORIGIN=https://localhost:8443 pnpm db:seed
      - name: Unit, integration, security and database tests
        run: pnpm test
      - name: Coverage of packages/crypto (at least 90% statements and branches, CLAUDE.md section 10)
        run: pnpm test:coverage:crypto
      - name: Coverage of the room authorization decision (at least 90% statements and branches, CM-T029)
        run: pnpm test:coverage:authz
      - name: Build
        run: pnpm build
      - name: Smoke test of the built API (fail-closed readiness, real database, graceful shutdown)
        run: pnpm smoke:api
      - name: Software bill of materials (CycloneDX)
        run: pnpm sbom:generate
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E (Chromium, Firefox, WebKit)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The cloud stack (ADR-014) on GitHub's native arm64 runner, the architecture of the Oracle
  # Ampere A1 VM: production images built natively, the stack run on loopback with a throwaway CA,
  # external edge checks, database access rules, the deployment smoke and collaboration tests
  # (invitation, burn secret, removal, key rotation) in three engines, screenshots, an encrypted
  # backup, an isolated restore drill and a full restore whose note and file are decrypted again.
  # The same script is `pnpm demo:verify` on a laptop (the local Docker demonstration).
  # No cloud account or credential is involved. Evidence files are uploaded (synthetic data only).
  cloud-stack:
    name: Cloud stack (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Operator tools (age for encrypted backups)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build, run and verify the cloud stack
        run: infrastructure/deployment/ci/stack-check.sh "${RUNNER_TEMP}/cloud-stack-evidence"
      - name: Upload stack evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-stack-arm64-evidence
          path: ${{ runner.temp }}/cloud-stack-evidence/
          retention-days: 30

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Fail on high or critical advisories
        run: pnpm audit:deps

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit
        run: node scripts/scan-secrets.mjs
